<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="wood" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#94806A"/>
      <stop offset="0.55" stop-color="#7E6A55"/>
      <stop offset="1" stop-color="#5E4E3E"/>
    </linearGradient>
    <radialGradient id="steel" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#C9C6BE"/>
      <stop offset="0.6" stop-color="#8A877F"/>
      <stop offset="1" stop-color="#4E4C47"/>
    </radialGradient>
    <radialGradient id="brass" cx="0.36" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#F3E2A8"/>
      <stop offset="0.45" stop-color="#C9A963"/>
      <stop offset="1" stop-color="#7A5C18"/>
    </radialGradient>
  </defs>
  <!-- the arm base: a pointy-top oak hex block with its chamfer lit from the top left -->
  <polygon points="32,3 57.1,17.5 57.1,46.5 32,61 6.9,46.5 6.9,17.5" fill="#3E3328" opacity="0.35" transform="translate(1.6 2)"/>
  <polygon points="32,3 57.1,17.5 57.1,46.5 32,61 6.9,46.5 6.9,17.5" fill="url(#wood)" stroke="#3E3328" stroke-opacity="0.55" stroke-width="1.2"/>
  <polygon points="32,8 52.8,20 52.8,44 32,56 11.2,44 11.2,20" fill="none" stroke="#B49E82" stroke-opacity="0.45" stroke-width="1"/>
  <!-- three brass pins on alternate corners -->
  <circle cx="32" cy="13" r="2.3" fill="url(#brass)"/>
  <circle cx="48.5" cy="41.5" r="2.3" fill="url(#brass)"/>
  <circle cx="15.5" cy="41.5" r="2.3" fill="url(#brass)"/>
  <!-- brass-lined bearing seat, steel bearing, brass dome cap -->
  <circle cx="32" cy="32" r="14.5" fill="#C9A963" stroke="#7A5C18" stroke-width="1"/>
  <circle cx="32" cy="32" r="12.5" fill="url(#steel)" stroke="#3A3834" stroke-opacity="0.6" stroke-width="0.8"/>
  <circle cx="32" cy="32" r="6.5" fill="url(#brass)" stroke="#6E5416" stroke-width="0.8"/>
  <circle cx="30" cy="29.8" r="1.8" fill="#FFF6D6" opacity="0.8"/>
</svg>
