<style>
  :root {

  .wrap { max-width: 1020px; margin: 0 auto; padding: 26px 20px 60px; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: .06em; }
  h1 small { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); letter-spacing: .22em; text-transform: uppercase; margin-left: 12px; }

  .tab {
    font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;

  .tab:hover { color: var(--ink); }

  .blurb { border: 1px solid var(--line); border-bottom: 0; background: var(--parch-3); padding: 10px 16px; font-size: 14.5px; font-style: italic; color: var(--ink-dim); margin-top: 8px; }

  .tapes { border: 1px solid var(--line); border-top: 0; background: var(--parch-3); padding: 8px 14px 10px; }

  .events .t { color: var(--ink-faint); margin-right: 8px; font-variant-numeric: tabular-nums; }

<script>
/*
 * GREAT WORK! — reference engine (v0.2 spec)
 *
 * Pure simulation, no DOM. Runs in Node (module.exports) and the browser
 * (window.GW). Commit-state arithmetic is exact integer hex math; the sweep
 * rule (§9) samples fractional kinematics in pixel space.
 */
(function (root) {
  'use strict';

  // ---------- hex math ----------
  const DIRS = [[1, 0], [0, 1], [-1, 1], [-1, 0], [0, -1], [1, -1]]; // E SE SW W NW NE
  const SQ3 = Math.sqrt(3);
  const mod6 = (n) => ((n % 6) + 6) % 6;
  const cellKey = (c) => c[0] + ',' + c[1];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
  const scale = (v, k) => [v[0] * k, v[1] * k];
  const eq = (a, b) => a[0] === b[0] && a[1] === b[1];
  // rotate an axial vector k steps clockwise (exact)
  function rotK(v, k) {
    let [q, r] = v;
    k = mod6(k);
    for (let i = 0; i < k; i++) { const t = q; q = -r; r = t + r; }
    return [q, r];
  }
  // RENDER ONLY (§ deterministic arithmetic below owns every simulation decision):
  // toPx / dirRadF / axialRound are float helpers kept for the canvas and the editor's
  // pointer picking. Nothing that decides a fault, an area cell or a cycle count may call them.
  const toPx = (c) => [SQ3 * (c[0] + c[1] / 2), 1.5 * c[1]];
  const dirRad = (d) => Math.atan2(1.5 * DIRS[mod6(d)][1], SQ3 * (DIRS[mod6(d)][0] + DIRS[mod6(d)][1] / 2));
  // NOTE: dir 0 (E) has pixel angle 0; each +1 dir step = +60° in screen space.
  const DIR0 = dirRad(0);
  const dirRadF = (dF) => DIR0 + dF * Math.PI / 3;
  function axialRound(x, y) {
    // invert toPx then cube-round
    const r = y / 1.5, q = x / SQ3 - r / 2;
    let rq = Math.round(q), rr = Math.round(r), rs = Math.round(-q - r);
    const dq = Math.abs(rq - q), dr = Math.abs(rr - r), ds = Math.abs(rs - (-q - r));
    if (dq > dr && dq > ds) rq = -rr - rs; else if (dr > ds) rr = -rq - rs;
    return [rq, rr];
  }

  // ==========================================================================
  // deterministic arithmetic
  // --------------------------------------------------------------------------
  // Every value below is Q16.16 fixed point: an ordinary JS number holding an
  // INTEGER equal to round(real · 65536). No floats, no Math.sqrt/cos/sin, and
  // never a JS bitwise operator (<<, >>, |, &) — those truncate to 32 bits and
  // would silently wreck Q16.16 magnitudes.
  //
  // Division is FLOOR division everywhere (see fdiv). C's `/` truncates toward
  // zero, so the on-chain oracle must implement an explicit floored divide for
  // negative operands or it will disagree by one ulp and, eventually, by a verdict.
  //
  // The constants in this block (SQRT3, HALF_SQRT3, THRESH2, COS5, SIN5) are
  // NORMATIVE: the verifier must copy the literals verbatim rather than recompute
  // them from a math library. Collision, area accrual and therefore cycles/SUM all
  // fall out of these operations, so the on-chain verifier must reproduce them
  // bit-for-bit. int64 is sufficient and required for every intermediate.
  // ==========================================================================
  const ONE = 65536;                              // Q16.16 scale, 2^16
  // Floor division. C oracle: NOT `a / b` (which truncates toward zero) — use a
  // floored variant, e.g. `q = a / b; if ((a % b) && ((a < 0) != (b < 0))) q--;`
  // Math.floor(a/b) here is exact for every magnitude this engine produces: |a| < 2^46,
  // so the IEEE quotient's absolute error is below 2^-30, while a non-multiple integer
  // dividend sits at least 1/b ≈ 2^-17 away from an integer quotient — the two can never
  // meet, so the floor never lands on the wrong side of an integer boundary.
  const fdiv = (a, b) => Math.floor(a / b);
  // Q16.16 multiply. Magnitude bound: board coords satisfy |q|,|r| <= ~40, so px
  // values stay under 2^23 in Q16.16 and any product here is under ~2^46 < 2^53.
  const fmul = (a, b) => fdiv(a * b, ONE);
  const fabs = (a) => (a < 0 ? -a : a);
  // round-half-up to a plain integer; identical to JS Math.round on these ranges.
  const qround = (a) => fdiv(a + 32768, ONE);

  const SQRT3 = 113512;        // round(sqrt(3) * 65536) = round(113511.6817...)
  const HALF_SQRT3 = 56756;    // round(sqrt(3)/2 * 65536) = round(56755.8409...) = SQRT3/2
  // Collision threshold, compared as SQUARED distance so no sqrt is ever needed.
  // Centers collide closer than 2*RADIUS*PITCH = 2*0.35*sqrt(3) = 0.7*sqrt(3) px.
  // (0.7*sqrt(3))^2 = 0.49*3 = 1.47 exactly, so
  //   THRESH2 = round(((0.7*sqrt(3))*65536)^2 / 65536) = round(1.47 * 65536)
  //           = round(96337.92) = 96338.
  const THRESH2 = 96338;
  // Sweep samples land on multiples of 60°/K_SAMPLES = 5°, so all trigonometry is
  // table lookup at 5° granularity. 13 entries cover one sextant, 0°..60°:
  // COS5[k] = round(cos(k*5°) * 65536), SIN5[k] = round(sin(k*5°) * 65536).
  const COS5 = [65536, 65287, 64540, 63303, 61584, 59396, 56756, 53684, 50203, 46341, 42126, 37590, 32768];
  const SIN5 = [0, 5712, 11380, 16962, 22415, 27697, 32768, 37590, 42126, 46341, 50203, 53684, 56756];
  const ANG_TURN = 72;                            // 5° units in a full turn
  const ANG_DIR = 12;                             // 5° units in one lattice direction (60°)
  const modA = (u) => ((u % ANG_TURN) + ANG_TURN) % ANG_TURN;
  // trigQ(u) = [cos, sin] in Q16.16 of the angle u*5°, u any integer.
  // The sextant (the whole-lattice-direction part) is applied as an exact 60°
  // rotation using cos60 = 1/2 and sin60 = sqrt(3)/2 = HALF_SQRT3; only the
  // remaining 0..55° reads the table.
  function trigQ(u) {
    u = modA(u);
    const s = fdiv(u, ANG_DIR), k = u - s * ANG_DIR;   // s in 0..5, k in 0..11
    const c = COS5[k], n = SIN5[k];
    switch (s) {
      case 0: return [c, n];
      case 1: return [fdiv(c, 2) - fmul(HALF_SQRT3, n), fmul(HALF_SQRT3, c) + fdiv(n, 2)];
      case 2: return [-fdiv(c, 2) - fmul(HALF_SQRT3, n), fmul(HALF_SQRT3, c) - fdiv(n, 2)];
      case 3: return [-c, -n];
      case 4: return [-fdiv(c, 2) + fmul(HALF_SQRT3, n), -fmul(HALF_SQRT3, c) - fdiv(n, 2)];
      default: return [fdiv(c, 2) + fmul(HALF_SQRT3, n), -fmul(HALF_SQRT3, c) + fdiv(n, 2)];
    }
  }
  // lattice cell -> pixel, in Q16.16. x = sqrt(3)*(q + r/2) = sqrt(3)*(2q+r)/2;
  // y = 1.5*r is exact (r * 98304) with no rounding at all.
  const toPxQ = (q, r) => [fdiv(SQRT3 * (2 * q + r), 2), r * 98304];
  // step of `n` lattice units along the direction u (in 5° units), in Q16.16 px.
  // One pitch is sqrt(3) px, so the leg length is n*SQRT3 (n <= 3 here).
  function stepQ(n, u) {
    const t = trigQ(u);
    return [fmul(SQRT3 * n, t[0]), fmul(SQRT3 * n, t[1])];
  }
  // rotate the Q16.16 offset (dx,dy) by u*5° about the origin.
  function rotQ(dx, dy, u) {
    const t = trigQ(u);
    return [fmul(t[0], dx) - fmul(t[1], dy), fmul(t[1], dx) + fmul(t[0], dy)];
  }
  // THE collision predicate. Squared distance in Q16.16 (Q32.32 descaled back by
  // fmul) against the normative squared threshold. No sqrt, no epsilon: `<` means
  // exactly-touching is not a collision, matching the float rule's -1e-9 slack.
  function tooCloseQ(ax, ay, bx, by) {
    const dx = ax - bx, dy = ay - by;
    return fmul(dx, dx) + fmul(dy, dy) < THRESH2;
  }
  // inverse of toPxQ + cube rounding, for area accrual. Q16.16 in, lattice cell out.
  function axialRoundQ(x, y) {
    const rQ = fdiv(y * 2, 3);                     // y / 1.5
    const qQ = fdiv(x * ONE, SQRT3) - fdiv(rQ, 2); // x / sqrt(3) - r/2
    const sQ = -qQ - rQ;
    let rq = qround(qQ), rr = qround(rQ);
    const rs = qround(sQ);
    const dq = fabs(rq * ONE - qQ), dr = fabs(rr * ONE - rQ), ds = fabs(rs * ONE - sQ);
    if (dq > dr && dq > ds) rq = -rr - rs; else if (dr > ds) rr = -rq - rs;
    return [rq, rr];
  }

  // ---------- constants ----------
  const OFFSETS = { 1: [0], 2: [0, 3], 3: [0, 2, 4], 6: [0, 1, 2, 3, 4, 5] };
  const PRICE = { 1: 20, 2: 24, 3: 26, 6: 30 };
  const ELBOW_COST = 10;   // mounting an arm on an arm
  const GRABBER_COST = 5;  // the grabber head's share of an arm's price

  // Arm pricing. Mounting on an arm costs ELBOW_COST. A child mounted at the
  // parent's TIP replaces the parent's grabber head outright — the parent can
  // no longer grab or pivot (validated in createSim) and its GRABBER_COST is
  // refunded. Mid-shaft mounts leave the parent's grabber alone.
  function tipParentIds(arms) {
    const byId = new Map(arms.map(a => [a.id, a]));
    const tips = new Set();
    for (const a of arms) {
      if (!a.mount.elbow) continue;
      const p = byId.get(a.mount.elbow.parent);
      if (p && a.mount.elbow.at === (p.len || 1)) tips.add(p.id);
    }
    return tips;
  }
  function armsCost(arms) {
    let cost = 0;
    for (const a of arms) cost += PRICE[a.grippers || 1] + (a.mount.elbow ? ELBOW_COST : 0);
    return cost - GRABBER_COST * tipParentIds(arms).size;
  }
  // transmutation roster adopted from Opus Magnum's campaign
  const METALS = ['Pb', 'Sn', 'Fe', 'Cu', 'Ag', 'Au'];
  const CARDINALS = ['Ai', 'Ea', 'Fi', 'Wa'];
  const GLYPH_PRICE = { bonders: 10, debonders: 15, calcifiers: 10, duplicators: 20,
    projectors: 20, purifiers: 20, animismus: 20, disposals: 0 };
  // RADIUS is documentation/export only — the simulation compares against THRESH2,
  // which is the normative Q16.16 form of (2*RADIUS*PITCH)^2. K_SAMPLES = 12 is what
  // makes every sweep angle an exact multiple of 60/12 = 5°, hence the COS5/SIN5 table.
  const RADIUS = 0.35, K_SAMPLES = 12;
  const OPS = 'GD+-PQWR';
  const DEFAULT_CAPS = { parts: 24, elbowDepth: 4, tapeLen: 64, atoms: 64, cycles: 4000, goal: 9 };

  // -- repeat expansion (NORMATIVE) --
  // A tape may carry 'R' repeat markers (Opus Magnum semantics): each marker
  // expands to a copy of the ops accumulated since the end of the previous
  // repeat block (consecutive markers copy that SAME segment); after a run of
  // markers the segment origin advances. The simulation always runs the
  // expanded tape — the marker survives serialization purely for legibility,
  // and the on-chain verifier must expand identically. `cells` maps display
  // positions for editors: {src} entries are the author's ops ('R' shown as a
  // marker), {ghost} entries are the copies, `engine` is the expanded index.
  function expandTape(src) {
    const ops = [], cells = [];
    let segStart = 0, i = 0;
    while (i < src.length) {
      if (src[i] !== 'R') {
        cells.push({ src: i, op: src[i], ghost: false, engine: ops.length });
        ops.push(src[i]); i++;
      } else {
        const seg = ops.slice(segStart);      // frozen once per run of consecutive markers
        while (i < src.length && src[i] === 'R') {
          cells.push({ src: i, op: '⟲', ghost: false, engine: null });
          for (const op of seg) { cells.push({ src: null, op, ghost: true, engine: ops.length }); ops.push(op); }
          i++;
        }
        segStart = ops.length;
      }
    }
    return { ops, cells };
  }

  // ---------- simulation ----------
  function createSim(puzzle, machine) {
    const caps = Object.assign({}, DEFAULT_CAPS, puzzle.caps || {});
    // reagents may be single atoms ({cell, elem}) or whole molecules ({cells, elems, bonds});
    // a molecule reagent respawns whenever every one of its cells is empty
    const INPUTS = (puzzle.inputs || []).map(g => g.cell
      ? { cells: [g.cell], elems: [g.elem], bonds: [] }
      : { cells: g.cells, elems: g.elems, bonds: g.bonds || [] });
    const S = {
      puzzle, caps,
      tick: 0,
      atoms: [],            // {id, cell, elem, bonds:Set<id>}
      nextAtom: 1,
      arms: [],             // runtime arm records
      products: 0,
      fault: null,          // {kind, tick, detail}
      area: new Set(),
      cost: 0,
      cycles: null,
      events: [],
      motion: null,         // cached last-tick motion for rendering
    };

    // -- build arms --
    const byId = {};
    for (const a of machine.arms) {
      const srcOps = (a.tape && a.tape.ops) || ['W'];
      const arm = {
        id: a.id, grippers: a.grippers || 1, len: a.len || 1,
        mount: a.mount,                       // {ground:[q,r]} | {elbow:{parent,at}}
        angle: a.angle || 0,                  // relative angle, 0..5
        // src is as authored (repeat markers intact); ops is what runs
        tape: { delay: (a.tape && a.tape.delay) || 0, src: srcOps, ops: expandTape(srcOps).ops },
        baseRot: 0,                           // frame rotation for ground arms
        carriers: [],                         // [{arm, grip}] while carried (ground arms only)
        carryRel: 0,
        holds: [],                            // per gripper: null | {kind:'atom',id} | {kind:'tower',id}
      };
      arm.holds = OFFSETS[arm.grippers].map(() => null);
      byId[arm.id] = arm;
      S.arms.push(arm);
    }
    S.cost += armsCost(S.arms);
    for (const fam in GLYPH_PRICE) S.cost += (puzzle[fam] || []).length * GLYPH_PRICE[fam];

    // -- validation --
    function reject(msg) { throw new Error('invalid machine: ' + msg); }
    if (S.arms.length > caps.parts) reject('too many parts');
    const baseCells = new Set();
    for (const arm of S.arms) {
      if (!OFFSETS[arm.grippers]) reject('bad gripper count ' + arm.grippers);
      if (arm.len < 1 || arm.len > 3) reject('bad arm length');
      // the cap binds both the authored tape and its expansion — what runs must fit
      if (arm.tape.src.length + arm.tape.delay > caps.tapeLen) reject('tape too long');
      if (arm.tape.ops.length + arm.tape.delay > caps.tapeLen) reject('tape too long');
      for (const op of arm.tape.src) if (!OPS.includes(op)) reject('bad op ' + op);
      if (arm.mount.elbow) {
        const p = byId[arm.mount.elbow.parent];
        if (!p) reject('elbow parent missing');
        if (arm.mount.elbow.at < 1 || arm.mount.elbow.at > p.len) reject('elbow position off shaft');
        let d = 0, cur = arm;
        while (cur.mount.elbow) { cur = byId[cur.mount.elbow.parent]; if (++d > caps.elbowDepth) reject('elbow too deep'); }
      } else {
        const k = cellKey(arm.mount.ground);
        if (baseCells.has(k)) reject('two bases on one cell');
        baseCells.add(k);
        arm.basePos = arm.mount.ground.slice();
      }
    }
    // a tip-mounted child replaces the parent's grabber head entirely: no
    // grabs, no releases, no pivots — turns only. Checked on the EXPANDED tape.
    {
      const tips = tipParentIds(S.arms);
      for (const arm of S.arms) {
        if (!tips.has(arm.id)) continue;
        for (const op of arm.tape.ops) {
          if (op === 'G' || op === 'D' || op === 'P' || op === 'Q') {
            reject('arm ' + arm.id + ' has no grabber (tip-mounted child) and cannot ' + op);
          }
        }
      }
    }

    // -- glyph shapes are fixed: placement is translation + rotation only (no mirroring) --
    // canonical footprints mirror Opus Magnum's: every two-cell glyph is an adjacent pair;
    // purification is inputs a, a+d with output a+rot(d); animismus is salts a, a+d with
    // vitae out a+rot(d) and mors out a+rot⁻¹(d); disposal is a cell plus its whole ring.
    const dirIndex = (v) => DIRS.findIndex(d => d[0] === v[0] && d[1] === v[1]);
    const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
    {
      const pair = (fam, g) => {
        if (g.length !== 2 || dirIndex(sub(g[1], g[0])) < 0) reject(fam + ' glyph must be two adjacent cells');
      };
      for (const fam of ['bonders', 'debonders', 'duplicators', 'projectors']) {
        for (const g of (puzzle[fam] || [])) pair(fam, g);
      }
      for (const g of (puzzle.purifiers || [])) {
        const k = g.length === 3 ? dirIndex(sub(g[1], g[0])) : -1;
        if (k < 0 || dirIndex(sub(g[2], g[0])) !== mod6(k + 1)) reject('purifier glyph shape is fixed');
      }
      for (const g of (puzzle.animismus || [])) {
        const k = g.length === 4 ? dirIndex(sub(g[1], g[0])) : -1;
        if (k < 0 || dirIndex(sub(g[2], g[0])) !== mod6(k + 1) || dirIndex(sub(g[3], g[0])) !== mod6(k + 5)) {
          reject('animismus glyph shape is fixed');
        }
      }
    }
    const disposalFootprint = (c) => [c, ...DIRS.map(d => add(c, d))];

    // -- layout validation: glyphs may not overlap each other; bases may not sit on glyphs --
    {
      const glyphCells = new Set();
      const claim = (c) => {
        const k = cellKey(c);
        if (glyphCells.has(k)) reject('glyph overlap at ' + k);
        glyphCells.add(k);
      };
      for (const fam in GLYPH_PRICE) for (const g of (puzzle[fam] || [])) {
        if (fam === 'disposals') { disposalFootprint(g).forEach(claim); continue; }
        for (const c of (Array.isArray(g[0]) ? g : [g])) claim(c);
      }
      for (const g of INPUTS) g.cells.forEach(claim);
      for (const c of ((puzzle.output && puzzle.output.cells) || [])) claim(c);
      for (const arm of S.arms) {
        if (!arm.mount.elbow && glyphCells.has(cellKey(arm.mount.ground))) {
          reject('base on glyph cell ' + cellKey(arm.mount.ground));
        }
      }
    }

    // initial atoms (tests/puzzles may pre-place)
    for (const a of (puzzle.atoms || [])) {
      S.atoms.push({ id: S.nextAtom++, cell: a.cell.slice(), elem: a.elem, bonds: new Set() });
    }

    for (const g of INPUTS) for (const c of g.cells) S.area.add(cellKey(c));
    for (const fam in GLYPH_PRICE) for (const g of (puzzle[fam] || [])) {
      if (fam === 'disposals') { disposalFootprint(g).forEach(c => S.area.add(cellKey(c))); continue; }
      for (const c of (Array.isArray(g[0]) ? g : [g])) S.area.add(cellKey(c));
    }
    for (const c of ((puzzle.output && puzzle.output.cells) || [])) S.area.add(cellKey(c));

    const atomAt = (cell) => S.atoms.find(a => eq(a.cell, cell));
    const groundArmAt = (cell) => S.arms.find(a => !a.mount.elbow && eq(pose(a).pos, cell));

    function molecule(anchor) {
      const seen = new Set([anchor.id]), out = [anchor], stack = [anchor];
      while (stack.length) {
        const a = stack.pop();
        for (const id of a.bonds) {
          if (seen.has(id)) continue;
          const b = S.atoms.find(x => x.id === id);
          if (b) { seen.add(id); out.push(b); stack.push(b); }
        }
      }
      return out;
    }

    // -- exact kinematics (integers) --
    // pose: {pos:[q,r], rot} — rot is the arm's frame rotation; global dir = rot+angle
    function pose(arm, guard) {
      guard = guard || new Set();
      if (guard.has(arm.id)) { S.fault = S.fault || { kind: 'grab-cycle', tick: S.tick }; return { pos: [0, 0], rot: 0 }; }
      guard.add(arm.id);
      if (arm.mount.elbow) {
        const p = byId[arm.mount.elbow.parent];
        const pp = pose(p, guard);
        const pd = mod6(pp.rot + p.angle);
        return { pos: add(pp.pos, scale(DIRS[pd], arm.mount.elbow.at)), rot: pd };
      }
      if (arm.carriers.length) {
        const { arm: h, grip } = arm.carriers[0];
        const hp = pose(h, guard);
        const hd = mod6(hp.rot + h.angle + OFFSETS[h.grippers][grip]);
        const hand = add(hp.pos, scale(DIRS[hd], h.len));
        return { pos: hand, rot: mod6(hd + arm.carryRel) };
      }
      return { pos: arm.basePos, rot: arm.baseRot };
    }
    const handCell = (arm, grip) => {
      const p = pose(arm);
      const hd = mod6(p.rot + arm.angle + OFFSETS[arm.grippers][grip]);
      return add(p.pos, scale(DIRS[hd], arm.len));
    };
    const handDir = (arm, grip) => mod6(pose(arm).rot + arm.angle + OFFSETS[arm.grippers][grip]);

    // supports(a): every arm whose motion carries a (elbow parents + carriers)
    function supportChain(arm) {
      const out = new Set(); const stack = [arm];
      while (stack.length) {
        const x = stack.pop();
        if (out.has(x.id)) continue;
        out.add(x.id);
        if (x.mount.elbow) stack.push(byId[x.mount.elbow.parent]);
        for (const c of x.carriers) stack.push(c.arm);
      }
      return out;
    }

    // -- fractional kinematics, DETERMINISTIC (Q16.16), valid during a cached motion --
    // These are the simulation's own kinematics: the sweep, the collision test and area
    // accrual all read them. They are sampled only at the K_SAMPLES instants f = k/K, and
    // since one dir step is 60° and K = 12, every angle is an exact multiple of 5°.
    // Angles are therefore carried as INTEGER counts of 5° units ("rotU"/"dU"), never radians:
    // a float dF of (n + m*k/12) is exactly the integer 12n + m*k here.
    // M = S.motion: {angle0:{id:θ}, delta:{id:±1|0}, pivot:{id:±1|0}, carryRel0:{id}, snapshot atoms}
    function poseQ(arm, k, M) {
      if (arm.mount.elbow) {
        const p = byId[arm.mount.elbow.parent];
        const pp = poseQ(p, k, M);
        const dU = pp.rotU + ANG_DIR * M.angle0[p.id] + M.delta[p.id] * k;
        const v = stepQ(arm.mount.elbow.at, dU);
        return { x: pp.x + v[0], y: pp.y + v[1], rotU: dU };
      }
      if (M.carriers0[arm.id] && M.carriers0[arm.id].length) {
        const { arm: hid, grip } = M.carriers0[arm.id][0];
        const h = byId[hid];
        const hp = poseQ(h, k, M);
        const hdU = hp.rotU + ANG_DIR * (M.angle0[h.id] + OFFSETS[h.grippers][grip]) + M.delta[h.id] * k;
        const v = stepQ(h.len, hdU);
        return {
          x: hp.x + v[0], y: hp.y + v[1],
          rotU: hdU + ANG_DIR * M.carryRel0[arm.id] + (M.pivot[hid] || 0) * k,
        };
      }
      const b = M.basePos0[arm.id];
      const px = toPxQ(b[0], b[1]);
      return { x: px[0], y: px[1], rotU: ANG_DIR * M.baseRot0[arm.id] };
    }
    function handQ(arm, grip, k, M) {
      const p = poseQ(arm, k, M);
      const dU = p.rotU + ANG_DIR * (M.angle0[arm.id] + OFFSETS[arm.grippers][grip]) + M.delta[arm.id] * k;
      const v = stepQ(arm.len, dU);
      return { x: p.x + v[0], y: p.y + v[1], dU };
    }

    // -- fractional kinematics (float pixels) -- RENDER ONLY, arbitrary f in [0,1].
    // Never consulted by step(); see poseQ/handQ above for the simulation's version.
    function poseF(arm, f, M) {
      if (arm.mount.elbow) {
        const p = byId[arm.mount.elbow.parent];
        const pp = poseF(p, f, M);
        const pdF = pp.rotF + (M.angle0[p.id] + M.delta[p.id] * f);
        const dir = dirRadF(pdF);
        return { x: pp.x + arm.mount.elbow.at * SQ3 * Math.cos(dir), y: pp.y + arm.mount.elbow.at * SQ3 * Math.sin(dir), rotF: pdF };
      }
      if (M.carriers0[arm.id] && M.carriers0[arm.id].length) {
        const { arm: hid, grip } = M.carriers0[arm.id][0];
        const h = byId[hid];
        const hp = poseF(h, f, M);
        const hdF = hp.rotF + (M.angle0[h.id] + M.delta[h.id] * f) + OFFSETS[h.grippers][grip];
        const dir = dirRadF(hdF);
        return {
          x: hp.x + h.len * SQ3 * Math.cos(dir), y: hp.y + h.len * SQ3 * Math.sin(dir),
          rotF: hdF + (M.carryRel0[arm.id] + (M.pivot[hid] || 0) * f),
        };
      }
      const px = toPx(M.basePos0[arm.id]);
      return { x: px[0], y: px[1], rotF: M.baseRot0[arm.id] };
    }
    function handF(arm, grip, f, M) {
      const p = poseF(arm, f, M);
      const hdF = p.rotF + (M.angle0[arm.id] + M.delta[arm.id] * f) + OFFSETS[arm.grippers][grip];
      const dir = dirRadF(hdF);
      return { x: p.x + arm.len * SQ3 * Math.cos(dir), y: p.y + arm.len * SQ3 * Math.sin(dir), dF: hdF };
    }

    // -- tape --
    function opAt(arm, tick) { // tick is 1-based
      if (tick <= arm.tape.delay) return 'W';
      if (!arm.tape.ops.length) return 'W';  // an all-marker tape expands to nothing
      return arm.tape.ops[(tick - arm.tape.delay - 1) % arm.tape.ops.length];
    }

    // ---------- step ----------
    function step() {
      if (S.fault || S.cycles !== null) return S;
      S.tick++;
      const ev = (e) => S.events.push(Object.assign({ tick: S.tick }, e));

      // 1. spawn — a reagent refills only when its whole footprint is empty
      for (const g of INPUTS) {
        if (g.cells.every(c => !atomAt(c))) {
          const born = g.cells.map((c, i) => {
            const a = { id: S.nextAtom++, cell: c.slice(), elem: g.elems[i], bonds: new Set() };
            S.atoms.push(a); return a;
          });
          for (const [i, j] of g.bonds) { born[i].bonds.add(born[j].id); born[j].bonds.add(born[i].id); }
          // render-only: tells a renderer where a reagent just refilled. Events are not
          // part of the conformance digest and the C oracle does not implement them.
          ev({ type: 'spawn', cells: g.cells.map(c => c.slice()), elems: g.elems.slice(), ids: born.map(a => a.id) });
        }
      }
      if (S.atoms.length > caps.atoms) { S.fault = { kind: 'exhaustion', tick: S.tick, detail: 'atom cap' }; return S; }

      const ops = {}; for (const arm of S.arms) ops[arm.id] = opAt(arm, S.tick);

      // 2a. releases
      for (const arm of S.arms) {
        if (ops[arm.id] !== 'D') continue;
        arm.holds.forEach((h, gi) => {
          if (h && h.kind === 'tower') {
            const t = byId[h.id];
            const p = pose(t); // pose BEFORE detaching, while still carried
            t.carriers = t.carriers.filter(c => !(c.arm === arm && c.grip === gi));
            if (t.carriers.length === 0) { // re-anchor exactly where it stands
              t.basePos = p.pos.slice(); t.baseRot = p.rot; t.mount = { ground: t.basePos.slice() };
            }
          }
          arm.holds[gi] = null;
        });
      }
      // 2b. grabs (simultaneous, evaluated against post-release state)
      for (const arm of S.arms) {
        if (ops[arm.id] !== 'G') continue;
        OFFSETS[arm.grippers].forEach((_, gi) => {
          if (arm.holds[gi]) return;
          const cell = handCell(arm, gi);
          const atom = atomAt(cell);
          if (atom) { arm.holds[gi] = { kind: 'atom', id: atom.id }; return; }
          const tower = groundArmAt(cell);
          if (tower && tower !== arm) {
            if (supportChain(arm).has(tower.id)) { S.fault = { kind: 'grab-cycle', tick: S.tick }; return; }
            const preRot = pose(tower).rot; // pose before this carrier attaches
            arm.holds[gi] = { kind: 'tower', id: tower.id };
            tower.carriers.push({ arm, grip: gi });
            if (tower.carriers.length === 1) tower.carryRel = mod6(preRot - handDir(arm, gi));
          }
        });
      }
      if (S.fault) return S;

      // 3. motion — capture start, apply deltas, verify constraints, commit
      const M = {
        angle0: {}, delta: {}, pivot: {}, carryRel0: {}, basePos0: {}, baseRot0: {}, carriers0: {},
        atoms: [], // snapshot for rendering/sweep: {id, elem, px0, holder:{armId,grip,s}|null, cell0}
      };
      for (const arm of S.arms) {
        M.angle0[arm.id] = arm.angle;
        const op = ops[arm.id];
        M.delta[arm.id] = op === '+' ? 1 : op === '-' ? -1 : 0;
        M.pivot[arm.id] = op === 'P' ? 1 : op === 'Q' ? -1 : 0;
        M.carryRel0[arm.id] = arm.carryRel;
        M.carriers0[arm.id] = arm.carriers.map(c => ({ arm: c.arm.id, grip: c.grip }));
        if (!arm.mount.elbow && arm.carriers.length === 0) { M.basePos0[arm.id] = arm.basePos.slice(); M.baseRot0[arm.id] = arm.baseRot; }
      }
      // hand states before...
      const handBefore = {};
      for (const arm of S.arms) OFFSETS[arm.grippers].forEach((_, gi) => {
        handBefore[arm.id + ':' + gi] = { cell: handCell(arm, gi), dir: handDir(arm, gi) };
      });
      // ...apply joint deltas + pivots-on-towers...
      for (const arm of S.arms) {
        arm.angle = mod6(arm.angle + M.delta[arm.id]);
        if (M.pivot[arm.id]) arm.holds.forEach(h => {
          if (h && h.kind === 'tower') byId[h.id].carryRel = mod6(byId[h.id].carryRel + M.pivot[arm.id]);
        });
      }
      // ...hand states after
      const handAfter = {};
      for (const arm of S.arms) OFFSETS[arm.grippers].forEach((_, gi) => {
        handAfter[arm.id + ':' + gi] = { cell: handCell(arm, gi), dir: handDir(arm, gi) };
      });

      // molecule transforms with agreement checking
      const molXf = new Map(); // rootAtomId -> {k, b:[q,r], holder:{armId,grip,s}, atoms:[]}
      const molOf = new Map(); // atomId -> rootAtomId
      for (const arm of S.arms) arm.holds.forEach((h, gi) => {
        if (!h || h.kind !== 'atom') return;
        const anchor = S.atoms.find(a => a.id === h.id);
        if (!anchor) { arm.holds[gi] = null; return; }
        const mol = molecule(anchor);
        const rootId = Math.min(...mol.map(a => a.id));
        const b0 = handBefore[arm.id + ':' + gi], b1 = handAfter[arm.id + ':' + gi];
        const s = M.pivot[arm.id] || 0;
        const k = mod6(b1.dir - b0.dir + s);
        // M(p) = R^k (p - h0) + h1  →  affine b = h1 - R^k h0
        const b = [b1.cell[0] - rotK(b0.cell, k)[0], b1.cell[1] - rotK(b0.cell, k)[1]];
        const prev = molXf.get(rootId);
        if (prev && (prev.k !== k || !eq(prev.b, b))) {
          S.fault = { kind: 'overconstraint', tick: S.tick, detail: 'molecule ' + rootId };
        } else if (!prev) {
          molXf.set(rootId, { k, b, holder: { armId: arm.id, grip: gi, s }, atoms: mol });
          for (const a of mol) molOf.set(a.id, rootId);
        }
      });
      if (S.fault) return S;
      // held-by-static + moved-by-other is covered: static holder contributes k=0,b=0
      // multi-carrier tower agreement: poses from each carrier must match
      for (const arm of S.arms) {
        if (arm.carriers.length < 2) continue;
        const p0 = pose(arm);
        for (let i = 1; i < arm.carriers.length; i++) {
          const alt = { pos: null, rot: null };
          const { arm: h, grip } = arm.carriers[i];
          const hp = pose(h);
          const hd = mod6(hp.rot + h.angle + OFFSETS[h.grippers][grip]);
          alt.pos = add(hp.pos, scale(DIRS[hd], h.len)); alt.rot = mod6(hd + arm.carryRel);
          if (!eq(alt.pos, p0.pos) || alt.rot !== p0.rot) {
            S.fault = { kind: 'overconstraint', tick: S.tick, detail: 'tower ' + arm.id };
          }
        }
      }
      if (S.fault) return S;

      // snapshot atoms + commit molecule motion (exact)
      M.bonds0 = [];
      {
        const seen = new Set();
        for (const a of S.atoms) for (const id of a.bonds) {
          const kk = Math.min(a.id, id) + '-' + Math.max(a.id, id);
          if (!seen.has(kk)) { seen.add(kk); M.bonds0.push([a.id, id]); }
        }
      }
      for (const a of S.atoms) {
        const rootId = molOf.get(a.id);
        const xf = rootId !== undefined ? molXf.get(rootId) : null;
        M.atoms.push({ id: a.id, elem: a.elem, cell0: a.cell.slice(), holder: xf ? xf.holder : null });
      }
      for (const [, xf] of molXf) for (const a of xf.atoms) {
        a.cell = add(rotK(a.cell, xf.k), xf.b);
      }

      // 3b. sweep — K sample instants, full pair check + area accumulation
      S.motion = M;
      // Sample index k is the whole sweep instant; every position below is Q16.16.
      const collidables = (k) => {
        const out = [];
        for (const m of M.atoms) {
          if (m.holder) {
            const arm = byId[m.holder.armId];
            const hK = handQ(arm, m.holder.grip, k, M);
            const h0 = handQ(arm, m.holder.grip, 0, M);
            const p0 = toPxQ(m.cell0[0], m.cell0[1]);
            // angle swept by the held molecule, in 5° units (s is the gripper pivot)
            const dU = hK.dU - h0.dU + m.holder.s * k;
            const rel = rotQ(p0[0] - h0.x, p0[1] - h0.y, dU);
            out.push({ kind: 'atom', id: m.id, elem: m.elem, x: hK.x + rel[0], y: hK.y + rel[1] });
          } else {
            const p = toPxQ(m.cell0[0], m.cell0[1]);
            out.push({ kind: 'atom', id: m.id, elem: m.elem, x: p[0], y: p[1] });
          }
        }
        for (const arm of S.arms) {
          if (arm.mount.elbow) continue; // elbows don't collide
          const p = poseQ(arm, k, M);
          out.push({ kind: 'base', id: arm.id, x: p.x, y: p.y });
        }
        return out;
      };
      for (let k = 1; k <= K_SAMPLES && !S.fault; k++) {
        const objs = collidables(k);
        for (const o of objs) S.area.add(cellKey(axialRoundQ(o.x, o.y)));
        for (const arm of S.arms) OFFSETS[arm.grippers].forEach((_, gi) => {
          const h = handQ(arm, gi, k, M); S.area.add(cellKey(axialRoundQ(h.x, h.y)));
        });
        for (let i = 0; i < objs.length; i++) for (let j = i + 1; j < objs.length; j++) {
          if (tooCloseQ(objs[i].x, objs[i].y, objs[j].x, objs[j].y)) {
            S.fault = { kind: 'collision', tick: S.tick, detail: `${objs[i].kind} ${objs[i].id} × ${objs[j].kind} ${objs[j].id} @ f=${k}/${K_SAMPLES}` };
            break;
          }
        }
      }
      if (S.fault) return S;

      // 4. glyphs — every transmutation acts on whatever rests on its cells (held or not)
      for (const [c1, c2] of (puzzle.bonders || [])) {
        const a1 = atomAt(c1), a2 = atomAt(c2);
        if (a1 && a2 && !a1.bonds.has(a2.id)) { a1.bonds.add(a2.id); a2.bonds.add(a1.id); ev({ type: 'bond', a: a1.id, b: a2.id, cells: [c1.slice(), c2.slice()] }); }
      }
      for (const [c1, c2] of (puzzle.debonders || [])) {
        const a1 = atomAt(c1), a2 = atomAt(c2);
        if (a1 && a2 && a1.bonds.has(a2.id)) { a1.bonds.delete(a2.id); a2.bonds.delete(a1.id); ev({ type: 'note', msg: 'bond severed', fx: 'debond', a: a1.id, b: a2.id, cells: [c1.slice(), c2.slice()] }); }
      }
      for (const g of (puzzle.calcifiers || [])) {
        const a = atomAt(g);
        if (a && CARDINALS.includes(a.elem)) { a.elem = 'Sa'; ev({ type: 'note', msg: 'calcified to salt', fx: 'calcify', a: a.id, cells: [g.slice()] }); }
      }
      for (const [ce, cs] of (puzzle.duplicators || [])) {
        const src = atomAt(ce), dst = atomAt(cs);
        if (src && dst && CARDINALS.includes(src.elem) && dst.elem === 'Sa') { dst.elem = src.elem; ev({ type: 'note', msg: 'duplicated ' + src.elem, fx: 'duplicate', a: src.id, b: dst.id, elem: src.elem, cells: [ce.slice(), cs.slice()] }); }
      }
      const kill = new Set();
      // conversion glyphs can't see bonded or held atoms (matches Opus Magnum)
      const gripped = new Set();
      for (const arm of S.arms) for (const h of arm.holds) if (h && h.kind === 'atom') gripped.add(h.id);
      const loose = (a) => a && a.bonds.size === 0 && !gripped.has(a.id);
      for (const [cm, cq] of (puzzle.projectors || [])) {
        const m = atomAt(cm), q0 = atomAt(cq);
        const q = loose(q0) ? q0 : null;
        const rung = m ? METALS.indexOf(m.elem) : -1;
        if (m && q && q.elem === 'Hg' && rung >= 0 && rung < METALS.length - 1 && !kill.has(q.id)) {
          kill.add(q.id); m.elem = METALS[rung + 1];
          ev({ type: 'note', msg: 'projection → ' + m.elem, fx: 'project', a: m.id, b: q.id, elem: m.elem, cells: [cm.slice(), cq.slice()] });
        }
      }
      for (const [ca, cb, co] of (puzzle.purifiers || [])) {
        const a0 = atomAt(ca), b0 = atomAt(cb);

            && !atomAt(co) && !kill.has(a.id) && !kill.has(b.id)) {
          kill.add(a.id); kill.add(b.id);
          S.atoms.push({ id: S.nextAtom++, cell: co.slice(), elem: METALS[rung + 1], bonds: new Set() });

        }
      }
      for (const [ca, cb, cv, cm] of (puzzle.animismus || [])) {
        const a0 = atomAt(ca), b0 = atomAt(cb);
        const a = loose(a0) ? a0 : null, b = loose(b0) ? b0 : null;
        if (a && b && a !== b && a.elem === 'Sa' && b.elem === 'Sa' && !atomAt(cv) && !atomAt(cm)
            && !kill.has(a.id) && !kill.has(b.id)) {
          kill.add(a.id); kill.add(b.id);
          S.atoms.push({ id: S.nextAtom++, cell: cv.slice(), elem: 'Vi', bonds: new Set() });
          S.atoms.push({ id: S.nextAtom++, cell: cm.slice(), elem: 'Mo', bonds: new Set() });
          ev({ type: 'note', msg: 'animismus → vitae + mors', fx: 'animismus', a: a.id, b: b.id, vi: S.nextAtom - 2, mo: S.nextAtom - 1, cells: [ca.slice(), cb.slice(), cv.slice(), cm.slice()] });

      }
      if (kill.size) {

          (h && h.kind === 'atom' && kill.has(h.id)) ? null : h);

        const heldIds = new Set();
        for (const arm of S.arms) for (const h of arm.holds) if (h && h.kind === 'atom') for (const a of molecule(S.atoms.find(x => x.id === h.id) || { id: -1, bonds: new Set() })) heldIds.add(a.id);
        const got = out.cells.map((c, i) => {
          const a = atomAt(c);
          return a && a.elem === out.elems[i] && !heldIds.has(a.id) ? a : null;
        });
        if (got.every(Boolean)
          && out.bonds.every(([i, j]) => got[i].bonds.has(got[j].id))
          && molecule(got[0]).length === out.cells.length) {

          S.products++;
          ev({ type: 'product', n: S.products, cells: out.cells.map(c => c.slice()), elems: out.elems.slice(), ids: got.map(a => a.id) });

      const arms = S.arms.map(arm => {

        else { const p = pose(arm); const px = toPx(p.pos); base = px; rotF = p.rot; angF = arm.angle; }

          if (!m.holder) { const p = toPx(m.cell0); return { id: m.id, elem: m.elem, x: p[0], y: p[1] }; }

          const hF = handF(arm, m.holder.grip, f, M), h0F = handF(arm, m.holder.grip, 0, M);
          const p0 = toPx(m.cell0);
          const dA = (hF.dF - h0F.dF + m.holder.s * f) * Math.PI / 3;
          const rx = p0[0] - h0F.x, ry = p0[1] - h0F.y;
          return { id: m.id, elem: m.elem, x: hF.x + rx * Math.cos(dA) - ry * Math.sin(dA), y: hF.y + rx * Math.sin(dA) + ry * Math.cos(dA) };
        });
      } else {
        atoms = S.atoms.map(a => { const p = toPx(a.cell); return { id: a.id, elem: a.elem, x: p[0], y: p[1] }; });
      }

      // a bond formed this tick appears when its atom lands, not while approaching
      let bondPairs;
      if (M && f < 1) {

        for (const a of S.atoms) for (const id of a.bonds) {
          const kk = Math.min(a.id, id) + '-' + Math.max(a.id, id);
          if (!seen.has(kk)) { seen.add(kk); bondPairs.push([a.id, id]); }

          sum: S.cycles !== null ? S.cost + S.cycles + S.area.size : null };

  }

<script>
/*
 * GREAT WORK! — machine codec v1
 *
 * The canonical serialization of a submission: the exact bytes a player will
 * one day put in calldata, and the share-string the editor emits today.
 *
 * Layout (all integers are LEB128 varints unless noted):
 *   u8       version (1)
 *   varint   arm count
 *   per arm, in submission order (order is the tiebreak identity — it is preserved):
 *     u8     flags: bits 0-1 gripper code (0,1,2,3 -> 1,2,3,6 grippers)
 *                   bits 2-3 length-1 (0..2)
 *                   bit  4   mounted on an elbow
 *     mount: elbow -> varint parent index (must precede this arm), varint at (1..len of parent)
 *            ground -> zigzag varint q, zigzag varint r
 *     u8     initial angle (0..5)
 *     varint delay block count
 *     varint tape length
 *     tape   ops packed 3 bits each (G D ↻ ↺ ↷ ↶ · ⟲ -> 0..7), little-endian within bytes.
 *            Code 7 (⟲, 'R') is the repeat marker: kept symbolic on the wire so shared
 *            solutions stay legible, expanded by the engine before simulation.
 *
 * Share strings are base64url of those bytes. Arm ids are not serialized —
 * they are labels, not identity; decode regenerates them as a0, a1, …
 *
 * Version 2 appends the rest of the board — the player places everything:
 *   varint  glyph count;   per glyph:   u8 type (see GLYPH_TYPES), zigzag q, zigzag r, u8 rot
 *   varint  reagent count; per reagent: varint shape index, zigzag q, zigzag r, u8 rot
 *   u8      product present (0/1);  if 1: zigzag q, zigzag r, u8 rot
 * Glyph shapes are canonical (see SPEC §3), so a placement is fully described
 * by its anchor cell and rotation. Reagent/product placements reference the
 * puzzle's molecule shapes by index — the shapes themselves are the puzzle's,
 * so a solution can never alter what is being asked for.
 */
(function (root) {
  'use strict';

  const OPS = 'GD+-PQWR';                      // 3-bit opcodes, in this order; R = repeat marker
  const GRIPS = [1, 2, 3, 6];
  const GLYPH_TYPES = ['bonders', 'debonders', 'calcifiers', 'duplicators',
    'projectors', 'purifiers', 'animismus', 'disposals'];
  const VERSION = 2;

  function zigzag(n) { return n < 0 ? -2 * n - 1 : 2 * n; }
  function unzigzag(n) { return n & 1 ? -(n + 1) / 2 : n / 2; }

  function encodeMachine(machine) {
    const out = [];
    const push = (b) => out.push(b & 0xff);
    const varint = (n) => { do { let b = n & 0x7f; n >>>= 7; if (n) b |= 0x80; push(b); } while (n); };
    const arms = machine.arms;
    const index = new Map(arms.map((a, i) => [a.id, i]));
    const hasLayout = machine.glyphs || machine.inputs || machine.output;

    push(hasLayout ? VERSION : 1);
    varint(arms.length);
    arms.forEach((a, i) => {
      const grip = GRIPS.indexOf(a.grippers || 1);
      const len = (a.len || 1) - 1;
      if (grip < 0) throw new Error('codec: bad gripper count');
      if (len < 0 || len > 2) throw new Error('codec: bad length');
      const elbow = a.mount.elbow;
      push(grip | (len << 2) | (elbow ? 16 : 0));
      if (elbow) {
        const p = index.get(elbow.parent);
        if (p === undefined || p >= i) throw new Error('codec: elbow parent must precede its child');
        varint(p); varint(elbow.at);
      } else {
        varint(zigzag(a.mount.ground[0])); varint(zigzag(a.mount.ground[1]));
      }
      push(((a.angle || 0) % 6 + 6) % 6);
      const tape = a.tape || {};
      const ops = tape.ops || ['W'];
      varint(tape.delay || 0);
      varint(ops.length);
      let acc = 0, bits = 0;
      for (const op of ops) {
        const code = OPS.indexOf(op);
        if (code < 0) throw new Error('codec: bad op ' + op);
        acc |= code << bits; bits += 3;
        while (bits >= 8) { push(acc); acc >>>= 8; bits -= 8; }
      }
      if (bits) push(acc);
    });
    if (hasLayout) {
      const glyphs = machine.glyphs || [];
      varint(glyphs.length);
      for (const g of glyphs) {
        const t = GLYPH_TYPES.indexOf(g.type);
        if (t < 0) throw new Error('codec: bad glyph type ' + g.type);
        push(t); varint(zigzag(g.at[0])); varint(zigzag(g.at[1])); push(((g.rot || 0) % 6 + 6) % 6);
      }
      const inputs = machine.inputs || [];
      varint(inputs.length);
      for (const g of inputs) {
        varint(g.ri || 0); varint(zigzag(g.at[0])); varint(zigzag(g.at[1])); push(((g.rot || 0) % 6 + 6) % 6);
      }
      if (machine.output) {
        push(1); varint(zigzag(machine.output.at[0])); varint(zigzag(machine.output.at[1]));
        push(((machine.output.rot || 0) % 6 + 6) % 6);
      } else push(0);
    }

  }

    let p = 0;
    const u8 = () => { if (p >= bytes.length) throw new Error('codec: truncated'); return bytes[p++]; };
    const varint = () => {
      let n = 0, shift = 0, b;
      do { b = u8(); n |= (b & 0x7f) << shift; shift += 7; } while (b & 0x80);
      return n >>> 0;
    };
    const version = u8();
    if (version !== 1 && version !== VERSION) throw new Error('codec: unknown version');
    const count = varint();
    const arms = [];
    for (let i = 0; i < count; i++) {
      const flags = u8();
      const grippers = GRIPS[flags & 3];
      const len = ((flags >> 2) & 3) + 1;
      if (len > 3) throw new Error('codec: bad length');
      let mount;
      if (flags & 16) {
        const parent = varint(), at = varint();
        if (parent >= i) throw new Error('codec: elbow parent must precede its child');
        mount = { elbow: { parent: 'a' + parent, at } };
      } else {
        const q = unzigzag(varint()), r = unzigzag(varint());
        mount = { ground: [q, r] };
      }
      const angle = u8();
      if (angle > 5) throw new Error('codec: bad angle');
      const delay = varint();
      const opsLen = varint();
      const ops = [];
      let acc = 0, bits = 0;
      for (let k = 0; k < opsLen; k++) {
        if (bits < 3) { acc |= u8() << bits; bits += 8; }
        const code = acc & 7; acc >>>= 3; bits -= 3;
        ops.push(OPS[code]);              // all 8 codes are valid; 7 is the repeat marker
      }
      arms.push({ id: 'a' + i, grippers, len, mount, angle, tape: { delay, ops } });
    }
    const out = { arms };
    if (version >= 2) {
      const zz = () => unzigzag(varint());
      const rot = () => { const r = u8(); if (r > 5) throw new Error('codec: bad rotation'); return r; };
      out.glyphs = [];
      for (let n = varint(); n > 0; n--) {
        const t = u8();
        if (t >= GLYPH_TYPES.length) throw new Error('codec: bad glyph type');
        out.glyphs.push({ type: GLYPH_TYPES[t], at: [zz(), zz()], rot: rot() });
      }
      out.inputs = [];
      for (let n = varint(); n > 0; n--) out.inputs.push({ ri: varint(), at: [zz(), zz()], rot: rot() });
      if (u8()) out.output = { at: [zz(), zz()], rot: rot() };
    }
    if (p !== bytes.length) throw new Error('codec: trailing bytes');
    return out;
  }

  // -- base64url share strings --
  const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
  function toString(bytes) {
    let s = '';
    for (let i = 0; i < bytes.length; i += 3) {
      const a = bytes[i], b = i + 1 < bytes.length ? bytes[i + 1] : 0, c = i + 2 < bytes.length ? bytes[i + 2] : 0;
      s += B64[a >> 2] + B64[((a & 3) << 4) | (b >> 4)];
      if (i + 1 < bytes.length) s += B64[((b & 15) << 2) | (c >> 6)];
      if (i + 2 < bytes.length) s += B64[c & 63];
    }
    return s;
  }
  function fromString(s) {
    const val = (ch) => { const v = B64.indexOf(ch); if (v < 0) throw new Error('codec: bad character'); return v; };
    const out = [];
    for (let i = 0; i < s.length; i += 4) {
      const chunk = s.slice(i, i + 4);
      if (chunk.length === 1) throw new Error('codec: bad string length');
      const a = val(chunk[0]), b = val(chunk[1]);
      out.push((a << 2) | (b >> 4));
      if (chunk.length > 2) { const c = val(chunk[2]); out.push(((b & 15) << 4) | (c >> 2));
        if (chunk.length > 3) { const d = val(chunk[3]); out.push(((c & 3) << 6) | d); } }
    }
    return Uint8Array.from(out);
  }

  const encodeString = (machine) => toString(encodeMachine(machine));
  const decodeString = (s) => decodeMachine(fromString(s));

  const CODEC = { encodeMachine, decodeMachine, toString, fromString, encodeString, decodeString, VERSION, GLYPH_TYPES };
  if (typeof module !== 'undefined' && module.exports) module.exports = CODEC;
  else root.GWCodec = CODEC;
})(typeof self !== 'undefined' ? self : this);

/*
 * GREAT WORK! — playmat effects overlay (RENDER ONLY).
 *
 * This file paints on top of the simulation. It reads S.events (which the engine
 * emits for the renderer's benefit and which no digest, metric or fault depends on)
 * and the per-frame renderState; it never writes to either. Nothing here can change
 * cycles, area, cost or a verdict — pull the whole file out and the machine runs the

 *

      c.restore();
    }

    // a whisper of a vignette so the mat reads as a surface, not a flat fill
    function mat(w, h) {
      const c = env.ctx;
      const g = c.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.32, w / 2, h / 2, Math.max(w, h) * 0.72);
      g.addColorStop(0, 'rgba(42,35,24,0)');
      g.addColorStop(1, 'rgba(42,35,24,0.085)');
      c.save(); c.fillStyle = g; c.fillRect(0, 0, w, h); c.restore();
    }

    // claw closure, smoothed: shuts fast like a mechanism, opens a touch slower
    function grip(key, target, dt) {
      if (!motion || stepMs === 0) { grips.set(key, target); return target; }
      let v = grips.get(key);
      if (v === undefined) { grips.set(key, target); return target; }
      const span = Math.max(40, stepMs * (target > v ? 0.22 : 0.34));
      const k = clamp01(dt / span);
      v += (target - v) * k;
      if (Math.abs(target - v) < 0.004) v = target;
      grips.set(key, v);
      return v;
    }

    // ---------- effect painting ----------
    // atomPx / armPx: id -> [x,y] in canvas pixels for this frame, so an effect anchored
    // to an atom follows it while it is carried.
    function draw(layer, atomPx, armPx) {
      const c = env.ctx, t = now(), s = env.s();
      c.save();
      c.lineCap = 'round';
      for (let i = 0; i < list.length; i++) {
        const fx = list[i];
        if (LAYER[fx.kind] !== layer) continue;
        const u = (t - fx.born) / fx.dur;
        if (u < 0 || u >= 1) continue;
        paint(c, s, fx, u, atomPx);
      }
      if (fault && layer === 'over') paintFault(c, s, t, atomPx, armPx);
      c.restore();
    }

    const at = (fx, i, atomPx) => {
      if (fx.ids && atomPx && atomPx[fx.ids[i]]) return atomPx[fx.ids[i]];
      return env.Pc(fx.cells[i]);
    };
    // The bond's visible stretch is only the gap between the two atom bodies — everything
    // past `edge` is hidden under a ball. Bond and debond both work in this frame:
    // u = 0 is the midpoint, u = ±1 is an atom centre, u = ±edge is where it disappears.
    function span(p1, p2, s) {
      const dx = (p2[0] - p1[0]) / 2, dy = (p2[1] - p1[1]) / 2;
      const d = Math.hypot(dx, dy) || 1, r = s * ATOM_R;
      const edge = Math.max(0.12, Math.min(0.95, (d - r * 0.92) / d));
      return { mx: p1[0] + dx, my: p1[1] + dy, dx: dx, dy: dy, d: d, edge: edge };
    }

    function paint(c, s, fx, u, atomPx) {
      switch (fx.kind) {
        case 'pulse': {
          const a = clamp01(tri(u));
          for (const cell of fx.cells) {
            const p = env.Pc(cell);
            env.hex(p[0], p[1], s * PITCH / 2 * (1.08 + 0.05 * eOut(u)));
            c.fillStyle = rgba(fx.col, 0.26 * a); c.fill();
            c.strokeStyle = rgba(fx.col, 0.75 * a); c.lineWidth = 1.1 + 1.4 * a; c.stroke();
          }
          break;
        }
        case 'inpulse': {
          const a = clamp01(tri(u));
          for (const cell of fx.cells) {
            const p = env.Pc(cell);
            c.beginPath(); c.arc(p[0], p[1], s * (0.62 + 0.14 * eOut(u)), 0, TAU);
            c.strokeStyle = rgba(COL.ink, 0.45 * a); c.lineWidth = 1 + 1.6 * a;
            c.setLineDash([3, 3]); c.stroke(); c.setLineDash([]);
          }
          break;
        }
        case 'ring': {
          const p = (fx.id != null && atomPx && atomPx[fx.id]) ? atomPx[fx.id] : env.Pc(fx.cell);
          let r, a;
          if (fx.mode === 'in') { r = s * (0.35 + 1.35 * (1 - eOut(u))); a = 0.30 + 0.55 * u; }
          else { r = s * (ATOM_R + 1.05 * eOut(u)); a = 0.85 * (1 - u) * (1 - u); }
          c.beginPath(); c.arc(p[0], p[1], r, 0, TAU);
          c.strokeStyle = rgba(fx.col, clamp01(a)); c.lineWidth = s * 0.085 * (fx.mode === 'in' ? 0.5 + u : 1 - u * 0.7);
          c.stroke();
          break;
        }
        case 'bond': {
          const p1 = at(fx, 0, atomPx), p2 = at(fx, 1, atomPx);
          const sp = span(p1, p2, s), mx = sp.mx, my = sp.my;
          const g = sp.edge * eOut(clamp01(u * 2.1)), a = 1 - eIn(u);
          // the weld runs out from the middle to both atom rims, then settles
          c.beginPath();
          c.moveTo(mx - sp.dx * g, my - sp.dy * g);
          c.lineTo(mx + sp.dx * g, my + sp.dy * g);
          c.strokeStyle = rgba(COL.flare, 0.9 * a); c.lineWidth = s * 0.26 * (1 - 0.35 * u);
          c.stroke();
          const r = s * (0.16 + 0.42 * eOut(u));
          const rg = c.createRadialGradient(mx, my, 0, mx, my, r);
          rg.addColorStop(0, rgba(COL.flare, 0.85 * a));
          rg.addColorStop(0.5, rgba(COL.brass, 0.35 * a));
          rg.addColorStop(1, rgba(COL.brass, 0));
          c.beginPath(); c.arc(mx, my, r, 0, TAU); c.fillStyle = rg; c.fill();
          break;
        }
        case 'debond': {
          const p1 = at(fx, 0, atomPx), p2 = at(fx, 1, atomPx);
          const sp = span(p1, p2, s), mx = sp.mx, my = sp.my;
          const a = (1 - u) * (1 - u), k = eOut(u);
          // the two stumps snap back under their atoms...
          for (const sgn of [-1, 1]) {
            const u1 = sp.edge * k, u2 = sp.edge;
            c.beginPath();
            c.moveTo(mx + sp.dx * sgn * u1, my + sp.dy * sgn * u1);
            c.lineTo(mx + sp.dx * sgn * u2, my + sp.dy * sgn * u2);
            c.strokeStyle = rgba(COL.ink, 0.8 * a); c.lineWidth = s * 0.19 * (1 - 0.35 * u);
            c.stroke();
          }
          // ...and the break throws a few splinters across the gap
          const nx = -sp.dy / sp.d, ny = sp.dx / sp.d;
          for (let i = 0; i < 4; i++) {
            const sgn = i % 2 ? 1 : -1, spread = (i < 2 ? 0.5 : 1);
            const ex = mx + nx * sgn * s * 0.55 * k * spread;
            const ey = my + ny * sgn * s * 0.55 * k * spread;
            c.beginPath(); c.moveTo(mx, my); c.lineTo(ex, ey);
            c.strokeStyle = rgba(COL.ox, 0.85 * a); c.lineWidth = s * 0.075 * (1 - u);
            c.stroke();
          }
          // the flash of the parting itself
          const fr = s * (0.10 + 0.26 * k);
          const rg = c.createRadialGradient(mx, my, 0, mx, my, fr);
          rg.addColorStop(0, rgba(COL.flare, 0.75 * a));
          rg.addColorStop(0.55, rgba(COL.ox, 0.35 * a));
          rg.addColorStop(1, rgba(COL.ox, 0));
          c.beginPath(); c.arc(mx, my, fr, 0, TAU); c.fillStyle = rg; c.fill();
          break;
        }
        case 'travel': {
          const p1 = env.Pc(fx.from), p2 = env.Pc(fx.to);
          const k = smooth(u);
          const x = p1[0] + (p2[0] - p1[0]) * k, y = p1[1] + (p2[1] - p1[1]) * k;
          c.save();
          c.globalAlpha = 0.9 * (1 - eIn(u));
          c.beginPath(); c.moveTo(p1[0], p1[1]); c.lineTo(x, y);
          c.strokeStyle = rgba(COL.brass, 0.35); c.lineWidth = s * 0.06; c.stroke();
          c.beginPath(); c.arc(x, y, s * (0.20 - 0.06 * u), 0, TAU);
          c.fillStyle = fx.hue; c.fill();
          c.strokeStyle = rgba(COL.flare, 0.9); c.lineWidth = s * 0.05; c.stroke();
          c.restore();
          break;
        }
        case 'ghost': {
          const p0 = env.P(fx.x, fx.y);
          const tgt = fx.to ? env.Pc(fx.to) : null;
          let x = p0[0], y = p0[1], r = s * ATOM_R, a = 1 - u;
          if (fx.style === 'sink' && tgt) {
            const k = eIn(u);
            x += (tgt[0] - x) * k; y += (tgt[1] - y) * k;
            r *= 1 - 0.85 * eOut(u); a = 1 - eIn(u);
          } else if (fx.style === 'converge' && tgt) {
            const k = smooth(u);
            x += (tgt[0] - x) * k; y += (tgt[1] - y) * k;
            r *= 1 - 0.55 * u; a = 1 - eIn(u);
          } else if (fx.style === 'spiral') {
            const th = u * 3.2, rad = s * 0.42 * (1 - u);
            x += Math.cos(th) * rad; y += Math.sin(th) * rad;
            r *= 1 - 0.9 * eIn(u); a = 1 - eIn(u);
          } else if (fx.style === 'dissolve') {
            let dx = 0, dy = -1;
            if (tgt) { dx = p0[0] - tgt[0]; dy = p0[1] - tgt[1]; }
            const nl = Math.hypot(dx, dy) || 1;
            x += (dx / nl) * s * 0.5 * eOut(u); y += (dy / nl) * s * 0.5 * eOut(u);
            r *= 1 + 0.3 * u; a = (1 - u) * 0.9;
          } else {
            r *= 1 - 0.25 * u;
          }
          if (r > 0.5 && a > 0.01) {
            c.save();
            c.globalAlpha = clamp01(a);
            c.beginPath(); c.arc(x, y, r, 0, TAU);
            c.fillStyle = env.fill(fx.elem); c.fill();
            c.strokeStyle = rgba(fx.style === 'dissolve' ? COL.gold : COL.ink, 0.7);
            c.lineWidth = 1.3; c.stroke();
            c.restore();
          }
          break;
        }
        case 'product': {
          // the assay: a gold wash runs over the molecule and lifts off the mat
          const a = (1 - u) * (1 - u);
          let cx = 0, cy = 0;
          for (const cell of fx.cells) { const p = env.Pc(cell); cx += p[0]; cy += p[1]; }
          cx /= fx.cells.length || 1; cy /= fx.cells.length || 1;
          for (const cell of fx.cells) {
            const p = env.Pc(cell);
            c.beginPath(); c.arc(p[0], p[1], s * (ATOM_R + 0.55 * eOut(u)), 0, TAU);
            c.strokeStyle = rgba(COL.gold, 0.65 * a); c.lineWidth = s * 0.07 * (1 - u);
            c.stroke();
          }
          const R = s * (0.9 + 1.5 * eOut(u));
          const rg = c.createRadialGradient(cx, cy, R * 0.55, cx, cy, R);
          rg.addColorStop(0, rgba(COL.gold, 0));
          rg.addColorStop(0.7, rgba(COL.gold, 0.20 * a));
          rg.addColorStop(1, rgba(COL.gold, 0));
          c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.fillStyle = rg; c.fill();
          for (let i = 0; i < 5; i++) {
            const th = (i / 5) * TAU + u * 0.7;
            const rr = s * (0.5 + 1.5 * eOut(u));
            c.beginPath();
            c.arc(cx + Math.cos(th) * rr, cy + Math.sin(th) * rr, s * 0.05 * (1 - u), 0, TAU);
            c.fillStyle = rgba(COL.flare, 0.9 * a); c.fill();
          }
          break;
        }
        default: break;
      }
    }

    function paintFault(c, s, t, atomPx, armPx) {
      const age = t - fault.born;
      for (const o of fault.objs) {
        let p = null;
        if (o.kind === 'atom' || o.kind === 'molecule') p = atomPx && atomPx[o.id];
        else p = armPx && armPx[o.id];
        if (!p) continue;
        // throbs like a warning lamp, then settles into a standing mark on the jam
        const damp = Math.max(0, 1 - age / 3000);
        const beat = motion ? 0.5 + 0.5 * Math.sin(age / 150) * damp : 1;
        c.beginPath(); c.arc(p[0], p[1], s * (ATOM_R + 0.18 + (motion ? 0.05 * beat : 0)), 0, TAU);
        c.strokeStyle = rgba(COL.ox, 0.45 + 0.4 * beat); c.lineWidth = s * 0.09;
        c.stroke();
        if (motion && age < 700) {
          const u = age / 700;
          c.beginPath(); c.arc(p[0], p[1], s * (ATOM_R + 1.5 * eOut(u)), 0, TAU);
          c.strokeStyle = rgba(COL.ox, 0.7 * (1 - u)); c.lineWidth = s * 0.1 * (1 - u);
          c.stroke();
        }
      }
    }

    function debug() {
      return {
        effects: list.length, cap: CAP, tint: tint.size, grow: grow.size,
        doom: doom.size, birth: birth.size, prev: prev.size, grips: grips.size,
        evIdx: evIdx, fault: fault ? fault.objs.length : 0, enabled: enabled,
        live: list.map(f => ({ k: f.kind, age: Math.round(now() - f.born), dur: Math.round(f.dur) })),
      };
    }

    return {
      reset: reset, prune: prune, harvest: harvest, noteAtoms: noteAtoms,
      atom: atom, atomBody: atomBody, mat: mat, grip: grip, draw: draw,
      freezeF: freezeF, debug: debug,
    };
  }

  const GWFX = { create: createFX, phaseEase: phaseEase, COL: COL, rgba: rgba, mixHex: mixHex };
  if (typeof module !== 'undefined' && module.exports) module.exports = GWFX;
  else root.GWFX = GWFX;
})(typeof self !== 'undefined' ? self : this);

</script>
<script>
(() => {
  'use strict';
  const EXAMPLES = window.GW_EXAMPLES;
  const ELEMS = {
    Pb: { fill: '#4A4640', label: '#F1E9D6' },
    Sn: { fill: '#9A968C', label: '#2A2318' },
    Fe: { fill: '#6E5F52', label: '#F1E9D6' },
    Cu: { fill: '#A0622B', label: '#F1E9D6' },
    Ag: { fill: '#D6D2CB', label: '#2A2318' },
    Au: { fill: '#C9A227', label: '#2A2318' },
    Hg: { fill: '#BDB9AF', label: '#2A2318' },
    Sa: { fill: '#F6F1E2', label: '#2A2318' },
    S:  { fill: '#D9A93A', label: '#2A2318' },
    Ai: { fill: '#CBD8DC', label: '#2A2318' },
    Ea: { fill: '#7A6E4F', label: '#F1E9D6' },
    Fi: { fill: '#C25436', label: '#F1E9D6' },
    Wa: { fill: '#5B7EA6', label: '#F1E9D6' },
    Vi: { fill: '#C97B8E', label: '#2A2318' },
    Mo: { fill: '#443C46', label: '#F1E9D6' },
  };
  // transmutation glyph families beyond the bonder: [field, label]
  const SPECIAL_GLYPHS = [
    ['debonders', 'DEBOND'], ['calcifiers', 'CALCIFY'], ['duplicators', 'DUPE'],
    ['projectors', 'PROJECT'], ['purifiers', 'PURIFY'], ['animismus', 'ANIMA'],
    ['disposals', 'DISPOSE'],
  ];
  const GLYPH = { G: 'G', D: 'D', '+': '↻', '-': '↺', P: '↷', Q: '↶', W: '·' };
  const CW = 980, CH = 560;
  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = CW * dpr; canvas.height = CH * dpr;
  canvas.style.aspectRatio = `${CW} / ${CH}`;

  let exIdx = 0, sim, view, phase = 1, running = true, stepMs = 140, done = false, frameDt = 16;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // the effects overlay reads the sim's event log and paints on top of it; it never
  // writes back. `view` is reassigned on every example, so hand it live accessors.
  const FX = GWFX.create({
    ctx: ctx,
    s: () => view.s,
    P: (x, y) => P(x, y),
    Pc: (cell) => Pc(cell),
    hex: (x, y, r) => hexPath(x, y, r),
    fill: (elem) => (ELEMS[elem] || { fill: '#999' }).fill,
  });
  const fxOn = () => !reduceMotion && stepMs !== 0;

  // ---- view fitting: run a throwaway sim to completion, fit to its full footprint ----
  function fitView(ex) {
    const probe = GW.createSim(ex.puzzle, ex.machine).run(500);
    const cells = [...probe.state.area].map(k => k.split(',').map(Number));
    for (const a of ex.machine.arms) if (a.mount.ground) cells.push(a.mount.ground);
    const pts = cells.map(GW.toPx);
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const minX = Math.min(...xs) - 2.6, maxX = Math.max(...xs) + 2.6;
    const minY = Math.min(...ys) - 2.6, maxY = Math.max(...ys) + 2.6;
    const s = Math.min(46, CW / (maxX - minX), CH / (maxY - minY));
    return { s, ox: CW / 2 - s * (minX + maxX) / 2, oy: CH / 2 - s * (minY + maxY) / 2 };
  }
  const P = (x, y) => [view.ox + view.s * x, view.oy + view.s * y];
  const Pc = (cell) => { const p = GW.toPx(cell); return P(p[0], p[1]); };
  const PITCH = Math.sqrt(3);
  // arm bases are hex fixtures bolted to the board, not discs: vertex radius as a
  // fraction of the cell pitch, sized to sit just inside the field line of its cell.
  const BASE_R = 0.52, PIN_R = 0.105;

  function hexPath(x, y, r) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 3 * i + Math.PI / 6;
      i === 0 ? ctx.moveTo(x + r * Math.cos(a), y + r * Math.sin(a)) : ctx.lineTo(x + r * Math.cos(a), y + r * Math.sin(a));
    }
    ctx.closePath();
  }

  // ---- arm parts, split so the painter can run them as separate passes ----
  // base plates and elbow pins are board furniture: they belong under the cargo.
  // shafts and claws are the moving machinery: they belong over everything, so one
  // arm's reach never vanishes beneath a neighbour's plate.
  function drawArmBase(arm, bx, by) {
    // ground bases are solid, collidable plates; elbows are pins. Both are
    // grid-aligned hexagons — the plate never turns with the arm it carries.
    if (arm.elbow) {
      hexPath(bx, by, view.s * PITCH * PIN_R);
      ctx.fillStyle = '#C9B57E'; ctx.fill();
      ctx.lineWidth = 1.4; ctx.strokeStyle = '#8A6A1E'; ctx.stroke();
    } else {
      hexPath(bx, by, view.s * PITCH * BASE_R);
      ctx.fillStyle = arm.carried ? '#D9C58C' : '#C9B57E'; ctx.fill();
      ctx.lineWidth = 1.8; ctx.strokeStyle = arm.carried ? '#8C3B2E' : '#8A6A1E'; ctx.stroke();
      ctx.beginPath(); ctx.arc(bx, by, view.s * 0.1, 0, Math.PI * 2);
      ctx.fillStyle = '#2A2318'; ctx.fill();
    }
  }

  // an arm that carries an elbow-mounted child is doing double duty: draw its
  // machinery heavier so the load-bearing shaft reads as the sturdier part.
  const PARENT_THICK = 1.15;

  // `thick` scales every stroke of the limb; `hideTip` drops the head that sits
  // where the arm's own facing ends — a child mounted at the tip has replaced that
  // grabber outright (the engine refunds it and forbids G/D/P/Q), and its elbow pin
  // is already drawn there by the base pass.
  function drawArmLimbs(arm, bx, by, thick, hideTip) {
    const k = thick || 1;
    ctx.strokeStyle = '#8A6A1E'; ctx.lineCap = 'round';
    // claws first, shafts after: the shaft lies OVER the head it carries
    arm.hands.forEach((h, gi) => {
      if (hideTip && gi === 0) return;
      const [hx, hy] = P(h.x, h.y);
      // three-fold symmetric grabber head; its pose is the arm's own direction
      ctx.beginPath(); ctx.arc(hx, hy, view.s * 0.13, 0, Math.PI * 2);
      ctx.lineWidth = view.s * 0.1 * k; ctx.stroke();
      // the claw snaps shut on a grab and eases open on a release
      const g = FX.grip(arm.id + ':' + gi, h.holding ? 1 : 0, frameDt);
      const r1 = view.s * 0.17, r2 = view.s * (0.5 - 0.12 * g);
      ctx.lineWidth = view.s * 0.11 * k;
      for (let kk = 0; kk < 3; kk++) {
        const a = h.ang + Math.PI / 3 + kk * (Math.PI * 2 / 3);
        const bend = 0.35 * g;
        ctx.beginPath();
        ctx.moveTo(hx + Math.cos(a) * r1, hy + Math.sin(a) * r1);
        ctx.lineTo(hx + Math.cos(a + bend) * r2, hy + Math.sin(a + bend) * r2);
        ctx.stroke();
      }
    });
    ctx.lineWidth = view.s * 0.16 * k;
    for (const h of arm.hands) {
      const [hx, hy] = P(h.x, h.y);
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(hx, hy); ctx.stroke();
    }
  }

  // which arms carry a child, and which had their grabber replaced by one at the tip
  function armFlags(arms) {
    const parents = new Set();
    for (const a of arms) if (a.mount && a.mount.elbow) parents.add(a.mount.elbow.parent);
    return { parents, tips: GW.tipParentIds(arms) };
  }

  function draw(f) {
    const rs = sim.renderState(f);
    const ex = EXAMPLES[exIdx];
    const atomPx = {}, armPx = {};
    for (const a of rs.atoms) atomPx[a.id] = P(a.x, a.y);
    for (const arm of rs.arms) armPx[arm.id] = P(arm.base[0], arm.base[1]);
    // atoms that appeared, changed element or vanished since the last frame become
    // materialisations, colour eases and ghosts — the event log said why, this says when
    FX.noteAtoms(rs.atoms);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#EAE0C9'; ctx.fillRect(0, 0, CW, CH);
    FX.mat(CW, CH);

    // hex field
    ctx.strokeStyle = 'rgba(160,140,95,0.17)'; ctx.lineWidth = 1;
    for (let q = -12; q <= 12; q++) for (let r = -12; r <= 12; r++) {
      const [x, y] = Pc([q, r]);
      if (x < -40 || x > CW + 40 || y < -40 || y > CH + 40) continue;
      hexPath(x, y, view.s * PITCH / 2 * 1.11); ctx.stroke();
    }

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // glyphs
    for (const [c1, c2] of (ex.puzzle.bonders || [])) {
      for (const c of [c1, c2]) {
        const [x, y] = Pc(c);
        hexPath(x, y, view.s * PITCH / 2 * 1.08);
        ctx.fillStyle = 'rgba(160,118,43,0.16)'; ctx.fill();
        ctx.strokeStyle = 'rgba(160,118,43,0.7)'; ctx.lineWidth = 1.4; ctx.stroke();
      }
      const [x1, y1] = Pc(c1), [x2, y2] = Pc(c2);
      ctx.strokeStyle = 'rgba(160,118,43,0.85)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
    // transmutation glyphs (oxblood tint, labeled)
    ctx.font = `700 9px 'Courier Prime', monospace`;
    for (const [fam, label] of SPECIAL_GLYPHS) {
      for (const g of (ex.puzzle[fam] || [])) {
        const cells = Array.isArray(g[0]) ? g : [g];
        if (fam === 'disposals') {
          for (const d of GW.DIRS) {
            const [x, y] = Pc([cells[0][0] + d[0], cells[0][1] + d[1]]);
            hexPath(x, y, view.s * PITCH / 2 * 1.08);
            ctx.fillStyle = 'rgba(140,59,46,0.07)'; ctx.fill();
            ctx.strokeStyle = 'rgba(140,59,46,0.3)'; ctx.lineWidth = 1.2; ctx.stroke();
          }
        }
        for (const c of cells) {
          const [x, y] = Pc(c);
          hexPath(x, y, view.s * PITCH / 2 * 1.08);
          ctx.fillStyle = 'rgba(140,59,46,0.12)'; ctx.fill();
          ctx.strokeStyle = 'rgba(140,59,46,0.6)'; ctx.lineWidth = 1.4; ctx.stroke();
        }
        for (let i = 1; i < cells.length; i++) {
          const [x1, y1] = Pc(cells[i - 1]), [x2, y2] = Pc(cells[i]);
          ctx.strokeStyle = 'rgba(140,59,46,0.55)'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        }
        const [lx, ly] = Pc(cells[0]);
        ctx.fillStyle = 'rgba(140,59,46,0.8)';
        ctx.fillText(label, lx, ly - view.s * 1.0);
      }
    }
    ctx.font = `700 10px 'Courier Prime', monospace`;
    for (const g of (ex.puzzle.inputs || [])) {
      const cells = g.cell ? [g.cell] : g.cells;
      const elems = g.cell ? [g.elem] : g.elems;
      ctx.setLineDash([3, 3]);
      for (const [i, j] of (g.bonds || [])) {
        const [x1, y1] = Pc(cells[i]), [x2, y2] = Pc(cells[j]);
        ctx.strokeStyle = 'rgba(42,35,24,0.35)'; ctx.lineWidth = view.s * 0.12;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      }
      cells.forEach((c, i) => {
        const [x, y] = Pc(c);
        ctx.beginPath(); ctx.arc(x, y, view.s * 0.62, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(42,35,24,0.5)'; ctx.lineWidth = 1.2; ctx.stroke();
        if (cells.length > 1) {
          ctx.globalAlpha = 0.45; ctx.fillStyle = '#2A2318';
          ctx.font = `600 ${Math.round(view.s * 0.42)}px 'EB Garamond', serif`;
          ctx.fillText(elems[i], x, y);
          ctx.globalAlpha = 1; ctx.font = `700 10px 'Courier Prime', monospace`;
        }
      });
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(42,35,24,0.55)';
      const [lx, ly] = Pc(cells[0]);
      ctx.fillText('IN·' + elems[0], lx, ly + view.s * 0.95);
    }
    const out = ex.puzzle.output;
    if (out) {
      ctx.setLineDash([4, 4]);
      for (const [i, j] of out.bonds) {
        const [x1, y1] = Pc(out.cells[i]), [x2, y2] = Pc(out.cells[j]);
        ctx.strokeStyle = '#33705E'; ctx.globalAlpha = 0.5; ctx.lineWidth = view.s * 0.14;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.globalAlpha = 1;
      }
      out.cells.forEach((c, i) => {
        const [x, y] = Pc(c);
        ctx.beginPath(); ctx.arc(x, y, view.s * 0.55, 0, Math.PI * 2);
        ctx.strokeStyle = '#33705E'; ctx.lineWidth = 1.3; ctx.stroke();
        ctx.globalAlpha = 0.55; ctx.fillStyle = '#33705E';
        ctx.font = `600 ${Math.round(view.s * 0.42)}px 'EB Garamond', serif`;
        ctx.fillText(out.elems[i], x, y);
        ctx.globalAlpha = 1; ctx.font = `700 10px 'Courier Prime', monospace`;
      });
      ctx.setLineDash([]);
      const [x, y] = Pc(out.cells[0]);
      ctx.fillStyle = '#33705E'; ctx.fillText('OUT', x, y - view.s * 1.0);
    }

    // effects that belong beneath the cargo: glyph footprints firing, ripples
    FX.draw('under', atomPx, armPx);

    // pass 1 — every base plate and elbow pin, before any cargo or machinery
    for (const arm of rs.arms) drawArmBase(arm, ...armPx[arm.id]);

    // bonds
    ctx.strokeStyle = '#2A2318'; ctx.lineWidth = view.s * 0.2; ctx.lineCap = 'round';
    for (const [i, j] of rs.bonds) {
      if (!atomPx[i] || !atomPx[j]) continue;
      ctx.beginPath(); ctx.moveTo(...atomPx[i]); ctx.lineTo(...atomPx[j]); ctx.stroke();
    }
    ctx.lineCap = 'butt';

    // pass 2 — atoms, above the plates; the claws come back over them in pass 3
    for (const a of rs.atoms) {
      const [x, y] = atomPx[a.id];
      const E = ELEMS[a.elem] || { fill: '#999', label: '#2A2318' };
      const st = FX.atom(a.id, a.elem);
      const r = view.s * 0.35 * PITCH * st.scale;
      FX.atomBody(x, y, r, st.fill, st.alpha);
      if (st.alpha > 0.3) {
        ctx.save();
        ctx.globalAlpha = st.alpha;
        ctx.fillStyle = E.label;
        ctx.font = `600 ${Math.round(view.s * 0.5 * st.scale)}px 'EB Garamond', serif`;
        ctx.fillText(a.elem, x, y + 0.5);
        ctx.restore();
      }
    }

    // sparks, welds, ghosts — above the atoms, below the machinery
    FX.draw('over', atomPx, armPx);

    // pass 3 — every shaft and claw, on top of all plates, atoms and neighbours
    const flags = armFlags(sim.state.arms);
    for (const arm of rs.arms) {
      drawArmLimbs(arm, ...armPx[arm.id],
        flags.parents.has(arm.id) ? PARENT_THICK : 1, flags.tips.has(arm.id));
    }

  }

  // ---- HUD / tapes / events ----
  function hud() {
    const st = sim.state, m = sim.metrics();
    document.getElementById('hTick').textContent = st.tick;
    document.getElementById('hCost').textContent = m.cost + 'g';
    document.getElementById('hArea').textContent = m.area;
    document.getElementById('hSum').textContent = m.sum !== null ? m.sum : (m.cost + st.tick + m.area) + '…';
    document.getElementById('hProd').textContent = st.products + '/' + st.caps.goal;
  }
  function buildTapes() {
    const host = document.getElementById('tapes');
    host.innerHTML = '';
    for (const arm of sim.state.arms) {
      const row = document.createElement('div'); row.className = 'tape-row';
      const lab = document.createElement('span'); lab.className = 'tape-label'; lab.textContent = 'ARM ' + arm.id;
      const cells = document.createElement('div'); cells.className = 'tape-cells';
      for (let i = 0; i < arm.tape.delay; i++) { const sp = document.createElement('span'); sp.className = 'delay'; sp.textContent = '»'; cells.appendChild(sp); }
      for (const op of arm.tape.ops) { const sp = document.createElement('span'); sp.textContent = GLYPH[op]; cells.appendChild(sp); }
      row.appendChild(lab); row.appendChild(cells); host.appendChild(row);
    }
  }
  function updateTapes() {
    const t = sim.state.tick;
    sim.state.arms.forEach((arm, ai) => {
      const cells = document.getElementById('tapes').children[ai].querySelector('.tape-cells').children;
      for (let i = 0; i < cells.length; i++) cells[i].classList.remove('on');
      if (t === 0) return;
      for (let i = 0; i < arm.tape.delay; i++) cells[i].classList.toggle('spent', t > i);
      const idx = t <= arm.tape.delay ? t - 1 : arm.tape.delay + (t - arm.tape.delay - 1) % arm.tape.ops.length;
      if (!sim.state.fault && sim.state.cycles === null) cells[idx].classList.add('on');
    });
  }
  function events() {
    const host = document.getElementById('events');
    const st = sim.state;
    // spawn events exist for the renderer's benefit; the log stays a log of decisions
    const rows = st.events.filter(e => e.type !== 'spawn').slice(-7).map(e => {
      if (e.type === 'bond') return `<div><span class="t">c${e.tick}</span>bond formed</div>`;
      if (e.type === 'product') return `<div><span class="t">c${e.tick}</span><span class="good">product ${e.n}/${st.caps.goal} verified</span></div>`;
      if (e.type === 'note') return `<div><span class="t">c${e.tick}</span>${e.msg}</div>`;
      if (e.type === 'complete') return `<div><span class="t">c${e.tick}</span><span class="good">COMPLETE — metrics sealed</span></div>`;
      return '';
    });
    if (st.fault) rows.push(`<div><span class="t">c${st.fault.tick}</span><span class="bad">FAULT: ${st.fault.kind}${st.fault.detail ? ' — ' + st.fault.detail : ''} · machine rejected</span></div>`);
    host.innerHTML = rows.join('') || '<div><span class="t">c0</span>engine ready</div>';
    host.scrollTop = host.scrollHeight;
  }
  function stamp() {
    const st = sim.state;
    const el = document.getElementById('stamp'), inner = document.getElementById('stampInner');
    if (st.fault) {
      inner.className = 'stamp-inner bad';
      inner.innerHTML = `Rejected · ${st.fault.kind}<small>tick ${st.fault.tick}${st.fault.detail ? ' · ' + st.fault.detail : ''}</small>`;
      el.classList.add('show'); done = true;
    } else if (st.cycles !== null) {
      const m = sim.metrics();
      inner.className = 'stamp-inner';
      inner.innerHTML = `Verified · ${st.products} of ${st.caps.goal}<small>${m.cost}g + ${m.cycles}c + ${m.area}a = SUM ${m.sum}</small>`;
      el.classList.add('show'); done = true;
    } else { el.classList.remove('show'); done = false; }
  }

  // ---- lifecycle ----
  function select(i) {
    exIdx = i;
    const ex = EXAMPLES[i];
    document.querySelectorAll('.tab').forEach((t, k) => t.classList.toggle('on', k === i));
    document.getElementById('blurb').textContent = ex.blurb;
    const editLink = document.getElementById('editLink');
    if (editLink && window.GWCodec) {
      try { editLink.href = 'editor.html#' + ex.key + '.' + GWCodec.encodeString(ex.machine); }
      catch (e) { editLink.href = 'editor.html#' + ex.key; }
    }
    sim = GW.createSim(ex.puzzle, ex.machine);
    view = fitView(ex);
    phase = 1; done = false;
    FX.reset(sim.state);
    buildTapes(); updateTapes(); hud(); events(); stamp();
    draw(1);
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(120, now - last); last = now; frameDt = dt;
    if (running && !done) {
      if (stepMs === 0) {
        for (let i = 0; i < 40 && !done; i++) { sim.step(); if (sim.state.fault || sim.state.cycles !== null) break; }
        phase = 1;
        updateTapes(); hud(); events(); stamp();
      } else {
        phase += dt / stepMs;
        if (phase >= 1) {
          sim.step();
          phase = 0;
          updateTapes(); hud(); events(); stamp();
        }
      }
    }
    // effects are enqueued from the events this step produced; at MAX the index still
    // advances so nothing backs up, it just doesn't get painted
    FX.harvest(sim.state, { stepMs: stepMs || 140, enabled: fxOn(), motion: !reduceMotion });
    FX.prune();
    // a collision freezes the render at the sweep instant it was found: the machine
    // reads as jammed, not as reset
    const frozen = FX.freezeF();
    const p = Math.min(phase, 1);
    draw(frozen !== null ? frozen : (reduceMotion ? p : GWFX.phaseEase(p)));
    requestAnimationFrame(frame);
  }

  // ---- controls ----
  const tabs = document.getElementById('tabs');
  EXAMPLES.forEach((ex, i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i === 0 ? ' on' : '');
    b.textContent = ex.name;
    b.addEventListener('click', () => { select(i); running = true; btnPlay.textContent = 'Pause'; });
    tabs.appendChild(b);
  });
  const btnPlay = document.getElementById('btnPlay');
  btnPlay.addEventListener('click', () => {
    if (done) { select(exIdx); running = true; btnPlay.textContent = 'Pause'; return; }
    running = !running; btnPlay.textContent = running ? 'Pause' : 'Play';
  });
  document.getElementById('btnStep').addEventListener('click', () => {
    running = false; btnPlay.textContent = 'Play';
    if (done) return;
    sim.step(); phase = 0;
    updateTapes(); hud(); events(); stamp();
  });
  document.getElementById('btnReset').addEventListener('click', () => { select(exIdx); running = true; btnPlay.textContent = 'Pause'; });
  document.querySelectorAll('.speed .ctl').forEach(b => b.addEventListener('click', () => {
    stepMs = +b.dataset.ms;
    document.querySelectorAll('.speed .ctl').forEach(x => x.classList.toggle('on', x === b));
  }));

  // test hook: lets automated checks watch the effect pool stay bounded
  window.__gwFX = () => FX.debug();

  select(0);
  if (reduceMotion) { running = false; btnPlay.textContent = 'Play'; }
  requestAnimationFrame(frame);
})();
</script>
