name: Deploy demo to GitHub Pages

on:
  push:
    branches: [claude/blockchain-pvp-game-contract-6vizhc]
    paths: ['demo/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage demo pages only
        run: |
          mkdir _site
          cp demo/great-work.html _site/index.html
          cp demo/halting-problem.html _site/halting-problem.html
          cp demo/lab.html _site/lab.html
          cp demo/editor.html _site/editor.html
          cp demo/gw-chain.js _site/gw-chain.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
